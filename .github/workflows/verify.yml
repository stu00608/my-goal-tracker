name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_app: ${{ steps.project.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/dev.py check
      - id: project
        run: |
          if [ -f ios/GoalTracker.xcodeproj/project.pbxproj ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    name: iOS Simulator tests
    needs: repository
    if: needs.repository.outputs.has_app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/dev.py doctor
      - run: python3 scripts/dev.py test
      - run: python3 scripts/dev.py test --scheme GoalTrackerWithWidget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-results
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
